function petal(a,p,outer){if(p<=0)return;ctx.save();ctx.translate(cx,cy);ctx.rotate(a);const len=R*(outer?1.45:1.12),wid=R*(outer?.46:.34),lines=outer?10:13;ctx.strokeStyle=outer?'rgba(255,202,30,.70)':'rgba(255,220,45,.95)';ctx.lineWidth=outer?1.35:1.55;ctx.lineCap='round';for(let j=0;j<lines;j++){const inset=j/lines,sc=1-inset*.065,q=Math.min(1,Math.max(0,p*1.08-inset*.045));if(q<=0)continue;ctx.beginPath();ctx.moveTo(0,0);ctx.bezierCurveTo(wid*.18*sc,-len*.16,wid*.58*sc,-len*.55,0,-len*q);ctx.moveTo(0,0);ctx.bezierCurveTo(-wid*.18*sc,-len*.16,-wid*.58*sc,-len*.55,0,-len*q);ctx.stroke()}ctx.restore()}
function center(p){if(p<=0)return;ctx.save();ctx.translate(cx,cy);const rad=R*.30*Math.min(p,1);for(let i=0;i<190;i++){const a=i*2.399963,rr=rad*Math.sqrt(i/190);ctx.beginPath();ctx.fillStyle=`rgba(150,40,28,${.35+Math.random()*.4})`;ctx.arc(Math.cos(a)*rr,Math.sin(a)*rr,1.2+Math.random()*1.5,0,Math.PI*2);ctx.fill()}ctx.restore()}
function draw(t){if(!start)start=t;const e=t-start;ctx.clearRect(0,0,W,H);ctx.fillStyle='#030303';ctx.fillRect(0,0,W,H);const g=ctx.createRadialGradient(cx,cy,0,cx,cy,R*1.8);g.addColorStop(0,'rgba(255,210,35,.11)');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);for(let i=0;i<16;i++){const a=i*Math.PI*2/16;petal(a,ease(Math.max(0,Math.min(1,(e-i*100)/950))),true);petal(a+Math.PI/16,ease(Math.max(0,Math.min(1,(e-i*100-280)/840))),false)}center(ease(Math.max(0,Math.min(1,(e-2100)/1050))));if(e>3500&&!finished){finished=true;document.getElementById('message').classList.add('show')}requestAnimationFrame(draw)}requestAnimationFrame(draw);
const bugs=[];for(let i=0;i<65;i++){const el=document.createElement('i');el.style.cssText=`position:fixed;width:${2+Math.random()*3}px;height:${2+Math.random()*3}px;border-radius:50%;background:#fff5a0;box-shadow:0 0 7px 2px rgba(255,220,50,.9);pointer-events:none;z-index:2`;document.body.appendChild(el);bugs.push({el,x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.65,vy:(Math.random()-.5)*.65,phase:Math.random()*7,speed:.015+Math.random()*.025})}function fireflies(){for(const b of bugs){b.x+=b.vx;b.y+=b.vy;b.phase+=b.speed;if(b.x<0||b.x>innerWidth)b.vx*=-1;if(b.y<0||b.y>innerHeight)b.vy*=-1;const o=.3+(Math.sin(b.phase)+1)*.34;b.el.style.left=b.x+'px';b.el.style.top=b.y+'px';b.el.style.opacity=o;b.el.style.transform=`scale(${.65+o*.8})`}requestAnimationFrame(fireflies)}fireflies();
const sunflowers=[];for(let i=0;i<12;i++){const el=document.createElement('div');el.textContent='🌻';el.style.cssText=`position:fixed;font-size:${24+Math.random()*24}px;pointer-events:none;z-index:4;user-select:none;filter:drop-shadow(0 0 7px rgba(255,210,40,.7))`;document.body.appendChild(el);sunflowers.push({el,x:Math.random()*Math.max(1,innerWidth-45),y:Math.random()*Math.max(1,innerHeight-45),vx:(Math.random()<.5?-1:1)*(.45+Math.random()*.65),vy:(Math.random()<.5?-1:1)*(.45+Math.random()*.65),a:Math.random()*6.28})}function moveSunflowers(){for(const s of sunflowers){const r=s.el.getBoundingClientRect();s.x+=s.vx;s.y+=s.vy;if(s.x<=0){s.x=0;s.vx=Math.abs(s.vx)}if(s.x+r.width>=innerWidth){s.x=innerWidth-r.width;s.vx=-Math.abs(s.vx)}if(s.y<=0){s.y=0;s.vy=Math.abs(s.vy)}if(s.y+r.height>=innerHeight){s.y=innerHeight-r.height;s.vy=-Math.abs(s.vy)}s.a+=.035;s.el.style.transform=`translate(${s.x}px,${s.y}px) rotate(${Math.sin(s.a)*3}deg)`}requestAnimationFrame(moveSunflowers)}moveSunflowers();
document.getElementById('again').onclick=()=>{start=0;finished=false;document.getElementById('message').classList.remove('show')};
